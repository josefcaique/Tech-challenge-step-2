preprocess:
  raw_data_path: data/raw/online_shoppers_intention.csv
  processed_data_path: data/processed/online_shoppers_intention_clean.csv

feature_eng:
  input_path: data/processed/online_shoppers_intention_clean.csv
  output_path: data/processed/features.parquet
  target: Revenue
  categorical_features:
    - Month
    - VisitorType
  drop_features:
    - Weekend

train:
  features_path: data/processed/features.parquet
  model_path: models/random_forest_model.joblib
  metrics_path: metrics/train_metrics.json
  target: Revenue
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 8

evaluate:
  model_path: models/random_forest_model.joblib
  features_path: data/processed/features.parquet
  metrics_path: metrics/evaluation.json
  target: Revenue
  test_size: 0.2
  random_state: 42
