[tool.poetry]
name = "tech-challenge-2"
version = "0.1.0"
description = "Sistema de recomendação de produtos para e-commerce baseado em comportamento de navegação dos usuários."
authors = [
    "Patrick-Covre <p.covredev@gmail.com>",
    "Beatriz-Ferrante <beatriz.ferrante37@gmail.com>",
    "Cecilia-Rocha <ceciliasdrochedo@gmail.com>",
    "Jose-Daniel <dni.lacerda@yahoo.com.br>",
]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.3.0"
scikit-learn = "^1.5.0"
mlflow = "^2.14.0"
pandas = "^2.2.0"
numpy = "^1.26.4"
pyarrow = "^16.1.0"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
pre-commit = "^3.7.1"
dvc = { extras = ["s3"], version = "^3.51.2" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["data", "models", "metrics", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "D",   # pydocstyle
]
ignore = [
    "D203", # 1 blank line before class
    "D213", # multi-line summary second line
    "E501",
    "NPY002",
    "PD003"
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "I001", "E401", "B008", "F401", "B905", "PD011", "PD002", "F541"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --cov=src --cov-report=term-missing"
