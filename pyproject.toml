[project]
name = "tech-challenge-step-2"
version = "0.1.0"
description = "Projeto de Machine Learning para previsão de Revenue com dataset de online shoppers intention"
readme = "README.md"
authors = [
    { name = "josefcaique",    email = "jcaique10@gmail.com"},
    { name = "Beatriz-Ferrante", email = "beatriz.ferrante37@gmail.com" },
    { name = "Cecilia-Rocha", email = "ceciliasdrochedo@gmail.com" },
    { name = "Jose-Daniel", email = "dni.lacerda@yahoo.com.br" },
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.18.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.4.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
mlflow = ">=2.18.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
joblib = ">=1.4.0"
torch = ">=2.0.0"
pyarrow = ">=14.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
ipykernel = ">=6.0.0"
mypy = "*"
pre-commit = ">=4.0.0"
dvc = ">=3.55.0"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "PD",
    "NPY",
]
ignore = ["E501", "NPY002", "PD003"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "I001", "E401", "B008", "F401", "B905", "PD011", "PD002", "F541"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
